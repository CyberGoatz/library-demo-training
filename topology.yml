name: library-demo-training

hosts:
  - name: server
    base_box:
      image: Canonical:0001-com-ubuntu-server-noble:24_04-lts:latest
      man_user: ubuntu
    flavor: Standard_B2s

  - name: client
    base_box:
      image: Canonical:0001-com-ubuntu-server-noble:24_04-lts:latest
      man_user: ubuntu
    flavor: Standard_B2s

routers:
  - name: router
    base_box:
      image: Canonical:0001-com-ubuntu-server-noble:24_04-lts:latest
      man_user: ubuntu
    flavor: Standard_B2s

networks:
  - name: server-switch
    cidr: 192.168.20.0/24
    accessible_by_user: False

  - name: client-switch
    cidr: 192.168.30.0/24
    accessible_by_user: True

net_mappings:
  - host: server
    network: server-switch
    ip: 192.168.20.20
  - host: client
    network: client-switch
    ip: 192.168.30.20

router_mappings:
  - router: router
    network: server-switch
    ip: 192.168.20.10
  - router: router
    network: client-switch
    ip: 192.168.30.10

groups: []
